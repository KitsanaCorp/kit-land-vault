<div class="flex flex-col lg:flex-row h-screen overflow-hidden">
    <!-- Mobile Header (visible < lg) -->
    <app-mobile-header />

    <!-- Sidebar (visible >= lg) -->
    <app-sidebar />

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-8 overflow-y-auto">

        <!-- ── Top Row Grid ────────────────────────────── -->
        <div class="grid grid-cols-1 lg:grid-cols-12 lg:grid-rows-2 gap-4 lg:gap-6 mb-4 lg:mb-6">
            <div class="order-1 lg:order-none col-span-1 lg:col-span-3 lg:row-span-2 flex flex-col h-full">
                <app-daily-budget class="flex-1 block" />
            </div>
            <div class="order-2 lg:order-none col-span-1 lg:col-span-3 lg:col-start-10 lg:row-start-1 flex flex-col h-full">
                <app-new-transaction-btn class="flex-1 block" />
            </div>
            <div class="order-3 lg:order-none col-span-1 lg:col-span-6 lg:row-span-2 lg:col-start-4 lg:row-start-1 flex flex-col h-full">
                <app-bucket-summary class="flex-1 block" />
            </div>
            <div class="order-4 lg:order-none col-span-1 lg:col-span-3 lg:col-start-10 lg:row-start-2 flex flex-col h-full">
                <app-partner-settlement class="flex-1 block" />
            </div>
        </div>

        <!-- ── Bottom Row Grid ─────────────────────────── -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6">
            <div class="col-span-1 lg:col-span-6 flex flex-col h-full">
                <app-balance-chart class="flex-1 block" />
            </div>
            <div class="col-span-1 lg:col-span-4 flex flex-col h-full">
                <app-recent-transactions class="flex-1 block" />
            </div>
            <div class="col-span-1 lg:col-span-2 flex flex-col h-full">
                <app-group-settlement class="flex-1 block" />
            </div>
        </div>

    </main>
</div>
