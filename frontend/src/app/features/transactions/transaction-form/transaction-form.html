<div class="min-h-screen bg-[#F7F5F0] flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    <!-- Header -->
    <div class="bg-[#5B428F] text-white p-5 flex items-center justify-between">
      <h2 class="text-lg font-bold">Record Expense</h2>
      <button (click)="goBack()" class="text-white/80 hover:text-white transition">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <!-- Form Content -->
    <div class="p-6">
      @if (loadingData) {
        <div class="flex justify-center py-10">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-slate-400"></i>
        </div>
      } @else {
        @if (errorMessage) {
          <div class="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm font-medium">
            <i class="fa-solid fa-circle-exclamation mr-2"></i> {{ errorMessage }}
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
          
          <!-- Amount -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Amount</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="text-slate-400 font-bold">฿</span>
              </div>
              <input type="number" formControlName="amount" placeholder="0.00"
                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#5B428F] focus:border-[#5B428F] outline-none transition text-lg font-bold text-slate-800"
                [class.border-red-400]="form.get('amount')?.invalid && form.get('amount')?.touched" />
            </div>
            @if (form.get('amount')?.invalid && form.get('amount')?.touched) {
              <p class="text-red-500 text-xs mt-1">Amount is required and must be > 0.</p>
            }
          </div>

          <div class="grid grid-cols-2 gap-4">
            <!-- Category -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">Category</label>
              <select formControlName="categoryId"
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#5B428F] outline-none transition text-sm text-slate-700"
                [class.border-red-400]="form.get('categoryId')?.invalid && form.get('categoryId')?.touched">
                <option value="" disabled selected>Select...</option>
                @for (cat of categories; track cat.id) {
                  <option [value]="cat.id">{{ cat.name }}</option>
                }
              </select>
            </div>

            <!-- Wallet -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">Wallet</label>
              <select formControlName="walletId"
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#5B428F] outline-none transition text-sm text-slate-700"
                [class.border-red-400]="form.get('walletId')?.invalid && form.get('walletId')?.touched">
                <option value="" disabled selected>Select...</option>
                @for (w of wallets; track w.id) {
                  <option [value]="w.id">{{ w.name }}</option>
                }
              </select>
            </div>
          </div>

          <!-- Split Type -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Split Method</label>
            <div class="grid grid-cols-3 gap-2">
              @for (type of splitTypes; track type.value) {
                <label class="cursor-pointer">
                  <input type="radio" formControlName="splitType" [value]="type.value" class="peer sr-only">
                  <div class="text-center px-2 py-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 peer-checked:bg-[#5B428F] peer-checked:text-white peer-checked:border-[#5B428F] transition hover:bg-slate-50">
                    {{ type.label }}
                  </div>
                </label>
              }
            </div>
          </div>

          <!-- Date -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Date</label>
            <input type="date" formControlName="transactionDate"
              class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#5B428F] outline-none transition text-sm text-slate-700" />
          </div>

          <!-- Description -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Note / Description</label>
            <input type="text" formControlName="description" placeholder="What was this for?"
              class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#5B428F] outline-none transition text-sm text-slate-700" />
          </div>

          <!-- Submit Button -->
          <div class="pt-4">
            <button type="submit" [disabled]="saving || form.invalid"
              class="w-full bg-[#5B428F] hover:bg-[#463173] text-white py-3.5 rounded-xl font-bold transition shadow-md flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
              @if (saving) {
                <i class="fa-solid fa-circle-notch fa-spin"></i> Saving...
              } @else {
                <i class="fa-solid fa-check"></i> Save Transaction
              }
            </button>
          </div>
        </form>
      }
    </div>
  </div>
</div>
