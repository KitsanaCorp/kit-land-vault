<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-900 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo / Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-500 shadow-lg shadow-emerald-500/30 mb-4">
                <span class="text-2xl">🏦</span>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">KitLandVault</h1>
            <p class="text-slate-400 mt-1 text-sm">Family Expense Tracker</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl">
            <h2 class="text-xl font-semibold text-white mb-6">Sign In</h2>

            @if (error) {
                <div class="bg-red-500/20 border border-red-500/30 text-red-300 px-4 py-3 rounded-xl text-sm mb-4">
                    {{ error }}
                </div>
            }

            <form (ngSubmit)="onSubmit()" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2" for="username">Username</label>
                    <input
                        id="username"
                        type="text"
                        [(ngModel)]="username"
                        name="username"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500/50 transition"
                        placeholder="Enter your username"
                        autocomplete="username" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2" for="password">Password</label>
                    <input
                        id="password"
                        type="password"
                        [(ngModel)]="password"
                        name="password"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500/50 transition"
                        placeholder="Enter your password"
                        autocomplete="current-password" />
                </div>

                <button
                    type="submit"
                    [disabled]="loading"
                    class="w-full py-3 px-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-semibold rounded-xl shadow-lg shadow-emerald-500/25 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    @if (loading) {
                        <span class="inline-flex items-center gap-2">
                            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                            Signing in...
                        </span>
                    } @else {
                        Sign In
                    }
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-white/10 text-center">
                <p class="text-slate-500 text-xs">Demo: <span class="text-slate-400">kit</span> / <span class="text-slate-400">password123</span></p>
            </div>
        </div>
    </div>
</div>
